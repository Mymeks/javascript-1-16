<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><title>Wysocki — Zadanie 8</title></head>
<body>
<h1>Zadanie 8 — Confirm Box</h1>
<p>Confirm służy do potwierdzania danych. Zwraca true po OK i false po Cancel.</p>
<button onclick="show_confirm()">Pokaż confirm box</button>
<script>
function show_confirm() {
  var r = confirm("Naciśnij klawisz");
  if (r === true) {
    document.body.innerHTML = "<h1>Nacisnąłeś OK!</h1>";
  } else {
    document.body.innerHTML = "<h1>Nacisnąłeś Cancel!</h1>";
  }
}
</script>
</body>
</html>
