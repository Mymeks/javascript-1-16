<h1>Zadanie 13 — kod źródłowy</h1>
<p>To jest kod programu do skopiowania.</p>
<textarea readonly spellcheck="false" style="width:100%;height:75vh;font-family:Consolas,monospace;font-size:14px;">&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pl&quot;&gt;
&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;title&gt;Wysocki — Zadanie 13&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
&lt;h1&gt;Zadanie 13 — Rozkład ułamka egipskiego na dwa ułamki&lt;/h1&gt;
&lt;script&gt;
var m_wys = parseInt(prompt(&quot;Podaj liczbę naturalną m &gt; 0:&quot;, &quot;4&quot;), 10);
if (Number.isInteger(m_wys) &amp;&amp; m_wys &gt; 0) {
  var d1_wys = m_wys + 1;
  var d2_wys = m_wys * (m_wys + 1);
  document.write(&quot;&lt;p&gt;1/&quot; + m_wys + &quot; = 1/&quot; + d1_wys + &quot; + 1/&quot; + d2_wys + &quot;&lt;/p&gt;&quot;);
} else {
  document.write(&quot;&lt;p&gt;Wpisz dodatnią liczbę całkowitą.&lt;/p&gt;&quot;);
}
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
<p><button onclick="window.close()">Zamknij okno</button></p>
</body>
