
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 16</title>
</head>
<body>
<div style="color:navy; font-size:30px;">
<script>
    var A = prompt("Podaj pierwszą liczbę A=", "");
    var B = prompt("Podaj drugą liczbę B=", "");

    A = parseInt(A);
    B = parseInt(B);

    var wynik = (A + B) * (A + B) * (A + B);
    var a3 = A * A * A;
    var skladnik1 = 3 * A * A * B;
    var skladnik2 = 3 * A * B * B;
    var b3 = B * B * B;

    document.write("Wczytane liczby: A=" + A + " B=" + B + "<br>");

    document.write(
        "(" + A + " + " + B + ")^3 = " +
        A + "^3 + 3*(" + A + ")^2*(" + B + ") + " +
        "3*(" + A + ")*(" + B + ")^2 + " + B + "^3 = " +
        a3 + " + " + skladnik1 + " + " +
        skladnik2 + " + " + b3 + " = " + wynik
    );
</script>
</div>
</body>
</html>
