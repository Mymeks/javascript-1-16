<textarea readonly spellcheck="false" style="width:100%;height:75vh;font-family:Consolas,monospace;font-size:14px;">&lt;!DOCTYPE html&gt;

&lt;div style=&quot;color:green;font-size:50px;&quot;&gt;
&lt;script&gt;
var D1_wys = parseInt(prompt(&quot;Data1=&quot;, &quot;&quot;), 10);

document.write(&quot;Ilość sekund między dniem &quot; + D1_wys + &quot; godz. &quot; + G1_wys +
               &quot; a dniem &quot; + D2_wys + &quot; godz. &quot; + G2_wys + &quot; = &quot; + sekund_wys + &quot; sekund&quot;);
&lt;/script&gt;
